name: Build TWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java (prevents JDK prompt issue)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install Bubblewrap
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 5. Verify manifest exists
      - name: Check manifest
        run: |
          test -f manifest.json || (echo "Missing manifest.json" && exit 1)

      # 6. FORCE NON-INTERACTIVE INIT (KEY FIX)
      - name: Init TWA (force non-interactive)
        run: |
          yes | bubblewrap init \
            --manifest https://joethondev.github.io/pdf-reader-pwa/manifest.json \
            --directory twa \
            --force

      # 7. Build APK (force yes again)
      - name: Build APK
        run: |
          cd twa
          yes | bubblewrap build --skipPwaValidation

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: twa/app-release-signed.apk